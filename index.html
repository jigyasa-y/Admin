<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<style>

    .loader{
    border: 1px solid black;
display: flex;
justify-content: center;
flex-direction: column;
align-items: center;
    z-index: 999;
    height: 100vh;
    width: 100vw;
    position: absolute;
    backdrop-filter: brightness(0.2);
}

#spinner{
    height: 3rem;
    width: 3rem;
    border: 2px solid white;
    border-radius: 50%;
    border-top:none;
    border-left:none;
    animation:spin 1s linear infinite;


}

#label{
    color:rgb(133, 125, 125);
    margin-top:5px;
    font-size: 25px;
    animation:fade 1.5s linear infinite;
}
@keyframes spin{
    0%{
        rotate: 0deg;

    }
    100%{
        rotate: 360deg;
 
    }
}

@keyframes fade{
    0%{
        opacity: 0;
    }
    50%{
        opacity: 1;
    }
    100%{
        opacity: 0;
    }
}

.hidden{
    display: none;
}
</style>

<body>
<div class="loader hidden">
    <span id="spinner"></span>
    <label for="" id="label">updating. . .</label>
</div>


<div class="popUp hidden">
    <span id="message"></span>
    <label id="deletePopup"><i class="fa-solid fa-xmark"></i></label>
</div>



    <div class="main-wrapper">
<div class="side-bar">
<div class="admin-details">
<label for="name" id="admin-name">Jigyasa Yadav</label><br>
<label for="email" id="admin-email">jigyasa@gmail.com</label>
</div>
<div class="modification">



    <label for="" id="userUpdate">Update user details</label>
    <label for="" id="skillUpdate">Update Skills</label>
    <label for="" id="contactUpdate">Update Contacts</label>
    <label for="" id="addProject">Add Projects</label>
    <label for="" id="viewProject">View Projects</label>
    <label for="" id="logoutBtn" style="background-color: #ff4444; color: white; margin-top: 20px;">
        <i class="fas fa-sign-out-alt"></i> Logout
    </label>
</div>


</div>

<div class="main-page">
<div class="header">
    <h1>Admin Dashboard</h1>
</div>

<div class="content-page">





</div>




</div>



    </div>

     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
